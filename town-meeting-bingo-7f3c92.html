<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Unofficial Norwood Town Meeting Bingo</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#183650;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px 8px;text-align:center}h1{font-size:clamp(22px,5vw,36px);margin:8px 0}p{margin:8px 0 16px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#4385ba;padding:8px;border-radius:5px}.square{min-width:0;min-height:clamp(85px,17vw,140px);border:0;background:#f4f4f4;color:#333;font:700 clamp(10px,2.25vw,20px)/1.15 system-ui;overflow-wrap:anywhere;padding:4px;cursor:pointer}.square[aria-pressed=true]{background:#8bd0ab;color:#173c2b}.square.win{outline:3px solid #d4a431;outline-offset:-3px}.square:focus-visible{outline:3px solid #003b71;outline-offset:-3px}.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px}.tools button{padding:10px 18px;background:#003b71;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}#status{min-height:1.5em;font-weight:bold}small{color:#536477}@media print{.tools,small{display:none}.square{border:1px solid #777;min-height:95px;color:black}.board{background:white}}@media screen and (max-width:600px){main{padding:10px 4px max(12px,env(safe-area-inset-bottom));}h1{font-size:clamp(20px,5.5vw,30px);margin:4px 0}main>p{font-size:13px;margin:5px 0 10px}.board{gap:2px;padding:3px;border-radius:4px}.square{min-height:clamp(82px,24vw,132px);padding:3px 2px;font-size:clamp(10px,3.05vw,16px);line-height:1.12;hyphens:auto;overflow-wrap:anywhere;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.square.long{font-size:clamp(9px,2.65vw,14px)}.square[aria-pressed=true]{box-shadow:inset 0 0 0 2px #26754c}.tools{gap:6px;margin:10px 0}.tools button{flex:1;min-height:44px;padding:8px 4px;font-size:13px;touch-action:manipulation}#status{margin:8px 0}small{font-size:11px}}@media screen and (orientation:landscape) and (max-height:500px){main{max-width:650px;padding-top:5px}.square{min-height:76px;font-size:12px}.square.long{font-size:10px}}</style></head><body><main><h1>Norwood Town Meeting Bingo</h1><p>Tap a square when it happens. Five in a row wins! Shuffle for a different card.</p><div id="board" class="board" aria-label="Bingo card"></div><p id="status" role="status" aria-live="polite"></p><div class="tools"><button id="shuffle">Shuffle Card</button><button id="reset">Reset marks</button><button id="print">Print card</button></div><small>Unofficial satire · Not affiliated with the Town of Norwood.</small></main><script>
const original=["Too Much Credit to Rogers & Lynch","Slippery Slope Fallacy","Moderator Sass","Question Has Already Been Answered","Loud \"NO!\" From Left Side of Room","Issue Not On Warrant","Austerity Metaphor (ex: \"tighten belts\")","Talks Into Dead Mic","Override Fear-Mongering","Golden Age of Norwood Nostalgia","What About The Seniors","Erroneous Point Of Order","FREE","Spot Zoning","Gas Leaks","Hospital Mentioned","Water meters","Tony Overexplains Until Person Asking Question Gives Up","“South Nahwood”","\"Windfall\"","History Lesson By John Hall","Request to Use Funds in Way Not Permitted","School Talked About As Separate From Town","Ed Lynch Asks Question Before Formulating Question","Blatant Racism"],pool=original.concat(["Pirate Lawyer raises his voice","Someone mentions being an attorney","Reminder that we are voting on the amendment","Someone reads info they Googled from their phone","Someone storms out","Tony mansplains","Spurious correlation","Someone uses the term \"super intelligence\"","Someone misunderstands a concept recently explained in detail"]),key='norwood-private-bingo-v1';let card=original.slice(),marks=new Set([12]);const lines=[];for(let i=0;i<5;i++){lines.push(Array.from({length:5},(_,j)=>i*5+j));lines.push(Array.from({length:5},(_,j)=>j*5+i))}lines.push([0,6,12,18,24],[4,8,12,16,20]);try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.card)&&saved.card.length===25&&saved.card[12]==='FREE'&&new Set(saved.card).size===25&&saved.card.every(s=>pool.includes(s))&&Array.isArray(saved.marks)){card=saved.card;marks=new Set(saved.marks.filter(i=>Number.isInteger(i)&&i>=0&&i<25));marks.add(12)}}catch(e){}
const board=document.getElementById('board');function paint(){const wins=lines.filter(l=>l.every(i=>marks.has(i))),winning=new Set(wins.flat());Array.from(board.children).forEach((b,i)=>{b.setAttribute('aria-pressed',String(marks.has(i)));b.classList.toggle('win',winning.has(i))});document.getElementById('status').textContent=wins.length?'BINGO! '+wins.length+' completed line'+(wins.length===1?'':'s')+'!':(marks.size-1)+' of 24 marked';try{localStorage.setItem(key,JSON.stringify({card,marks:[...marks]}))}catch(e){}}function render(){board.replaceChildren();card.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='square'+(s.length>36?' long':'');b.textContent=s;if(i===12)b.setAttribute('aria-disabled','true');b.addEventListener('click',()=>{if(i===12)return;marks.has(i)?marks.delete(i):marks.add(i);paint()});board.append(b)});paint()}document.getElementById('reset').onclick=()=>{marks=new Set([12]);paint()};document.getElementById('shuffle').onclick=()=>{const a=pool.filter(s=>s!=='FREE');for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.length=24;a.splice(12,0,'FREE');card=a;marks=new Set([12]);render()};document.getElementById('print').onclick=()=>window.print();render();
</script></body></html>
