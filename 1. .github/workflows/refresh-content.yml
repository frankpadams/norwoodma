name: Refresh Norwood.ma content

on:
  schedule:
    # Every two hours. Minute 17 avoids top-of-hour GitHub Actions congestion.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norwood-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-automation.txt
      - name: Refresh events and news
        run: python scripts/refresh_content.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/ feeds/; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "norwood-ma-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ feeds/
          git commit -m "data: automated content refresh"
          git push
