name: Update official town search index
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-town-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Index public town pages
        run: python3 scripts/index-official-town.py
      - name: Commit updated index
        run: |
          if ! git diff --quiet -- data/official-town-search.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/official-town-search.json
            git commit -m "Refresh official town search index"
            git push
          fi
