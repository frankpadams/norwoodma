name: Capture PMA calendar API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pma-browser-diagnostic.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture public PMA calendar JSON
        run: |
          curl --fail --silent --show-error --location \
            -H 'Accept: application/json' \
            'https://app.norwoodpma.org/api/website-calendar' \
            -o data/pma-calendar-api.json
          python -m json.tool data/pma-calendar-api.json >/dev/null
      - name: Commit diagnostic
        run: |
          git config user.name "norwood-ma-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pma-calendar-api.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: capture PMA calendar API schema"
          git pull --rebase origin main
          git push origin HEAD:main
