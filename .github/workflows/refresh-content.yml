name: Refresh Norwood.ma content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-content.yml'
      - 'scripts/refresh_content.py'
  schedule:
    # Primary refresh every two hours. Minute 17 avoids top-of-hour congestion.
    - cron: '17 */2 * * *'
    # Backup 30 minutes later. It exits immediately when the primary run already
    # published fresh content, but catches a dropped/delayed primary schedule.
    - cron: '47 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norwood-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether backup refresh is needed
        id: freshness
        shell: bash
        run: |
          # Manual runs and the :17 primary schedule always execute.
          if [[ "${{ github.event_name }}" != "schedule" || "${{ github.event.schedule }}" != "47 */2 * * *" ]]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The :47 schedule is a watchdog. If refresh-status.json was generated
          # recently, the :17 run worked and there is nothing to do.
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/refresh-status.json")
          needed = True
          if p.exists():
              try:
                  stamp = json.loads(p.read_text()).get("generated_at")
                  if stamp:
                      age = datetime.now(timezone.utc) - datetime.fromisoformat(stamp).astimezone(timezone.utc)
                      needed = age.total_seconds() > 45 * 60
              except Exception:
                  needed = True

          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run_refresh={'true' if needed else 'false'}\n")
          print("Backup refresh needed." if needed else "Primary refresh is fresh; backup exits.")
          PY

      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.run_refresh == 'true'
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        if: steps.freshness.outputs.run_refresh == 'true'
        run: pip install -r requirements-automation.txt

      - name: Refresh events and news
        if: steps.freshness.outputs.run_refresh == 'true'
        run: python scripts/refresh_content.py

      - name: Publish refreshed data onto latest main
        if: steps.freshness.outputs.run_refresh == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/ feeds/; then
            echo "No content changes."
            exit 0
          fi

          # Preserve the freshly generated files, then move onto the newest main.
          # This avoids rebase conflicts when site/code edits land while refresh runs.
          rm -rf /tmp/norwood-refresh
          mkdir -p /tmp/norwood-refresh
          cp -a data /tmp/norwood-refresh/data
          cp -a feeds /tmp/norwood-refresh/feeds

          git fetch origin main
          git reset --hard origin/main
          rm -rf data feeds
          cp -a /tmp/norwood-refresh/data ./data
          cp -a /tmp/norwood-refresh/feeds ./feeds

          if git diff --quiet -- data/ feeds/; then
            echo "Latest main already has this refreshed content."
            exit 0
          fi

          git config user.name "norwood-ma-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ feeds/
          git commit -m "data: automated content refresh"
          git push origin HEAD:main
