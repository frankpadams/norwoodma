name: Refresh Norwood.ma content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-content.yml'
      - 'scripts/refresh_content.py'
      - 'data/source-registry.json'
      - 'data/calendar-sources.json'
      - 'data/calendar-sources-data.js'
      - 'data/events-seed.json'
  schedule:
    # Primary refresh every two hours. Minute 17 avoids top-of-hour congestion.
    - cron: '17 */2 * * *'
    # Backup 30 minutes later. It exits immediately when the primary run already
    # published fresh content, but catches a dropped/delayed primary schedule.
    - cron: '47 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norwood-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether backup refresh is needed
        id: freshness
        shell: bash
        run: |
          # Manual runs and the :17 primary schedule always execute.
          if [[ "${{ github.event_name }}" != "schedule" || "${{ github.event.schedule }}" != "47 */2 * * *" ]]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The :47 schedule is a watchdog. If refresh-status.json was generated
          # recently, the :17 run worked and there is nothing to do.
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/refresh-status.json")
          needed = True
          if p.exists():
              try:
                  stamp = json.loads(p.read_text()).get("generated_at")
                  if stamp:
                      age = datetime.now(timezone.utc) - datetime.fromisoformat(stamp).astimezone(timezone.utc)
                      needed = age.total_seconds() > 45 * 60
              except Exception:
                  needed = True

          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run_refresh={'true' if needed else 'false'}\n")
          print("Backup refresh needed." if needed else "Primary refresh is fresh; backup exits.")
          PY

      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.run_refresh == 'true'
        with:
          python-version: '3.12'

      - name: Validate automation Python syntax
        if: steps.freshness.outputs.run_refresh == 'true'
        run: python -m compileall -q scripts

      - name: Install automation dependencies
        if: steps.freshness.outputs.run_refresh == 'true'
        run: pip install -r requirements-automation.txt

      - name: Test calendar source behavior
        if: steps.freshness.outputs.run_refresh == 'true'
        run: python -m unittest discover -s tests -v

      - name: Download PMA public calendar
        if: steps.freshness.outputs.run_refresh == 'true'
        run: |
          curl --fail --silent --show-error --location \
            -H 'Accept: application/json' \
            'https://app.norwoodpma.org/api/website-calendar' \
            -o data/pma-calendar-api.json
          python -m json.tool data/pma-calendar-api.json >/dev/null

      - name: Refresh events and news
        if: steps.freshness.outputs.run_refresh == 'true'
        env:
          BAND_PMA_ICAL_URL: ${{ secrets.BAND_PMA_ICAL_URL }}
        run: python scripts/refresh_content.py

      - name: Generate crawlable event structured data
        if: steps.freshness.outputs.run_refresh == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, re, html
          from datetime import date
          from pathlib import Path

          page = Path('events.html')
          events = json.loads(Path('data/events.json').read_text())
          today = date.today().isoformat()
          items = []
          for e in events:
              if not isinstance(e, dict) or e.get('publish_candidate') is False:
                  continue
              start = e.get('start') or {}
              end = e.get('end') or {}
              day = start.get('date', '')
              if not isinstance(day, str) or not re.fullmatch(r'\\d{4}-\\d{2}-\\d{2}', day) or day < today:
                  continue
              title = str(e.get('title') or '').strip()
              if not title:
                  continue
              start_time = start.get('time')
              end_time = end.get('time')
              start_at = day + ('T' + start_time + ':00-04:00' if isinstance(start_time, str) and re.fullmatch(r'\\d{2}:\\d{2}', start_time) else '')
              # Date-only values are preferable to invented event times or time zones.
              if 'T' in start_at:
                  from zoneinfo import ZoneInfo
                  from datetime import datetime
                  start_at = datetime.fromisoformat(day + 'T' + start_time).replace(tzinfo=ZoneInfo('America/New_York')).isoformat()
              obj = {'@type': 'Event', 'name': title, 'startDate': start_at,
                     'url': 'https://www.norwood.ma/events.html'}
              if isinstance(end.get('date'), str) and re.fullmatch(r'\\d{4}-\\d{2}-\\d{2}', end['date']):
                  end_at = end['date']
                  if isinstance(end_time, str) and re.fullmatch(r'\\d{2}:\\d{2}', end_time):
                      from datetime import datetime
                      from zoneinfo import ZoneInfo
                      end_at = datetime.fromisoformat(end_at + 'T' + end_time).replace(tzinfo=ZoneInfo('America/New_York')).isoformat()
                  obj['endDate'] = end_at
              if e.get('notes'):
                  obj['description'] = str(e['notes'])[:900]
              place = str(e.get('venue') or '').strip()
              address = str(e.get('address') or '').strip()
              if place or address:
                  obj['location'] = {'@type': 'Place', 'name': place or address}
                  if address:
                      obj['location']['address'] = address
              if e.get('source_url') and str(e['source_url']).startswith('https://'):
                  obj['sameAs'] = str(e['source_url'])
              items.append(obj)
          # Use a bounded, chronologically ordered set of real upcoming calendar entries.
          items.sort(key=lambda x: x['startDate'])
          items = items[:150]
          payload = json.dumps({'@context': 'https://schema.org', '@graph': items}, ensure_ascii=False).replace('<', '\\u003c')
          block = '<!-- BEGIN GENERATED EVENT SEO --><script type="application/ld+json">' + payload + '</script><!-- END GENERATED EVENT SEO -->'
          source = page.read_text()
          source = re.sub(r'<!-- BEGIN GENERATED EVENT SEO -->.*?<!-- END GENERATED EVENT SEO -->', '', source, flags=re.S)
          source = source.replace('</head>', block + '</head>', 1)
          page.write_text(source)
          Path('data/event-seo-status.json').write_text(json.dumps({'events_in_schema': len(items), 'generated_from': 'data/events.json'}, indent=2) + '\\n')
          print(f'Generated structured data for {len(items)} upcoming events.')
          PY

      - name: Verify approved community submissions are reaching the importer
        if: steps.freshness.outputs.run_refresh == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('data/events.json').read_text())
          live = [e for e in rows if e.get('discovered_by') == 'community_submission_feed']
          fallback = [e for e in rows if e.get('discovered_by') == 'approved_submission_fallback']
          print(f'Approved submission feed: {len(live)} event(s); approved fallback: {len(fallback)} event(s).')
          if not live:
              print('::warning title=Community event approvals not importing::No approved events from the moderation feed reached the published calendar. Check the Apps Script GET feed and its status mapping.')
          PY

      - name: Publish refreshed data onto latest main
        if: steps.freshness.outputs.run_refresh == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/ feeds/ events.html; then
            echo "No content changes."
            exit 0
          fi

          # Preserve only changed generated files. Copying the entire data directory
          # would revert registry/seed edits that land while a refresh is running.
          rm -rf /tmp/norwood-refresh
          mkdir -p /tmp/norwood-refresh
          git diff --name-only -z -- data/ feeds/ events.html > /tmp/norwood-refresh/changed
          while IFS= read -r -d '' path; do
            mkdir -p "/tmp/norwood-refresh/$(dirname "$path")"
            cp -a "$path" "/tmp/norwood-refresh/$path"
          done < /tmp/norwood-refresh/changed

          git fetch origin main
          git reset --hard origin/main
          while IFS= read -r -d '' path; do
            mkdir -p "$(dirname "$path")"
            cp -a "/tmp/norwood-refresh/$path" "$path"
          done < /tmp/norwood-refresh/changed

          if git diff --quiet -- data/ feeds/; then
            echo "Latest main already has this refreshed content."
            exit 0
          fi

          git config user.name "norwood-ma-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ feeds/ events.html
          git commit -m "data: automated content refresh"
          git push origin HEAD:main
