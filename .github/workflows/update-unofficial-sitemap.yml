name: Update unofficial town sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: '27 9 * * 0'
  push:
    paths:
      - 'scripts/update-unofficial-sitemap.py'
      - 'scripts/render-unofficial-sitemap.py'
      - '.github/workflows/update-unofficial-sitemap.yml'
permissions:
  contents: write
concurrency:
  group: unofficial-town-sitemap
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update-unofficial-sitemap.py
      - run: python scripts/render-unofficial-sitemap.py
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unofficial-sitemap.json unofficialsitemap.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh unofficial town sitemap"
          git pull --rebase
          git push
