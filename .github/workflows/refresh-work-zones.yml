name: Refresh local work zones
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: local-work-zones
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh-work-zones.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/work-zones.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh MassDOT work zones"
            git pull --rebase
            git push
          fi
