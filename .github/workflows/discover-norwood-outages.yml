name: Discover Norwood outage geographic feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/discover-norwood-outages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: norwood-outage-discovery
          path: outage-discovery.json
          retention-days: 2
