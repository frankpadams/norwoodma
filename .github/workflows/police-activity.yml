name: Monitor Norwood police activity sources
on:
  schedule:
    - cron: '20 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-police-activity.py
      - name: Commit status only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/police-activity.json
          git diff --cached --quiet || (git commit -m "Monitor police activity source availability" && git push)
