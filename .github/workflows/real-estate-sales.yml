name: Refresh Norwood recent home sales
on:
  schedule:
    - cron: '17 13 1,15 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: norwood-real-estate-sales
  cancel-in-progress: false
jobs:
  update-sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight HTML parsing dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Refresh only when a dated sold-sales report is available
        run: python scripts/update_norwood_sales.py
      - name: Commit verified changes
        run: |
          if ! git diff --quiet -- real-estate.html; then
            git config user.name "norwoodma-sales-bot"
            git config user.email "actions@users.noreply.github.com"
            git add real-estate.html
            git commit -m "Refresh Norwood closed-sale report"
            git push
          fi
