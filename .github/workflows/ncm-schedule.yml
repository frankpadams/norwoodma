name: Refresh NCM broadcast schedules
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/update_ncm_schedule.py
      - name: Commit refreshed schedule if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncm-now-playing.json
          git diff --cached --quiet || (git commit -m "Update NCM broadcast schedules" && git push)
