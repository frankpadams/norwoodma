name: Index Town Meeting PDF text
on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * 0'
permissions:
  contents: write
concurrency:
  group: town-meeting-pdf-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf beautifulsoup4 requests
      - name: Extract public PDF text and build crawlable pages
        run: python scripts/index_town_meeting_pdfs.py
      - name: Commit searchable pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add town-meeting-documents sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh searchable Town Meeting PDF text pages"
            git push
          fi
