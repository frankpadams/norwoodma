name: Refresh gas prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-gas-prices
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch current fuel prices
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 scripts/update-gas-prices.py
      - name: Publish changed prices
        run: |
          git add data/gas-prices.json
          if git diff --cached --quiet; then
            echo "No gas-price changes."
            exit 0
          fi
          git config user.name "Norwood.ma automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh gas prices"
          git push
