name: Install elections social preview image
on:
  push:
    paths:
      - '.github/workflows/install-elections-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and crop CC BY 4.0 photograph
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib
          from PIL import Image, ImageOps
          from io import BytesIO
          source='https://commons.wikimedia.org/wiki/Special:Redirect/file/Ballot_with_ballot_box_in_Sonoma%2C_California_-_November_2022_-_Sarah_Stierch_02.jpg'
          req=urllib.request.Request(source,headers={'User-Agent':'NorwoodMA-Website/1.0 (Creative Commons attribution retained)'})
          raw=urllib.request.urlopen(req,timeout=45).read()
          image=Image.open(BytesIO(raw)).convert('RGB')
          image=ImageOps.fit(image,(1200,630),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
          pathlib.Path('assets').mkdir(exist_ok=True)
          image.save('assets/elections-social-2026.jpg',quality=86,optimize=True)
          PY
      - name: Point social tags to locally hosted image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elections.html')
          s=p.read_text()
          remote='https://commons.wikimedia.org/wiki/Special:Redirect/file/Ballot%20with%20ballot%20box%20in%20Sonoma%2C%20California%20-%20November%202022%20-%20Sarah%20Stierch%2002.jpg'
          assert s.count(remote)==2, 'Expected two social image tags'
          s=s.replace(remote,'https://www.norwood.ma/assets/elections-social-2026.jpg')
          s=s.replace('<meta property="og:image:alt"', '<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:alt"')
          s=s.replace('Social sharing photo:', 'Social sharing photo (cropped for social preview):')
          p.write_text(s)
          PY
      - name: Commit the image and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/elections-social-2026.jpg elections.html
          git diff --cached --quiet || (git commit -m "Host CC BY ballot photo locally for election social previews" && git push)
