name: Install elections social preview image
on:
  push:
    paths:
      - '.github/workflows/install-elections-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and crop CC BY 4.0 election sticker photograph
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib
          from PIL import Image, ImageOps
          from io import BytesIO
          source='https://commons.wikimedia.org/wiki/Special:Redirect/file/An_election_judge_reaches_for_a_roll_of_%22I_Voted%22_stickers_at_Woodrow_Town_Hall_on_Primary_Election_Day%2C_Aug._11%2C_2026%2C_in_Cass_County%2C_Minnesota.jpg'
          req=urllib.request.Request(source,headers={'User-Agent':'NorwoodMA-Website/1.0 (Creative Commons attribution retained)'})
          raw=urllib.request.urlopen(req,timeout=45).read()
          image=Image.open(BytesIO(raw)).convert('RGB')
          image=ImageOps.fit(image,(1200,630),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
          pathlib.Path('assets').mkdir(exist_ok=True)
          image.save('assets/elections-social-2026.jpg',quality=86,optimize=True)
          PY
      - name: Point social tags to locally hosted image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elections.html')
          s=p.read_text()
          local='https://www.norwood.ma/assets/elections-social-2026.jpg'
          assert s.count(local)==2, 'Expected two local social image tags'
          if 'og:image:width' not in s:
              s=s.replace('<meta property="og:image:alt"', '<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:alt"')
          p.write_text(s)
          PY
      - name: Commit the image and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/elections-social-2026.jpg elections.html
          git diff --cached --quiet || (git commit -m "Host election sticker photo locally for election social previews" && git push)
